<!DOCTYPE html>
<html>
<head>
  <title>Book Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sticky-top">

<header>
  <img src="images/logo.jpeg" alt="Laxmi Hotel Logo" class="logo">

  <div class="header-text">
    <h1>Laxmi Hotel & Restaurant</h1>
    <p>Fresh Food | Friendly Service | Beautiful Taste</p>
  </div>
</header>

<nav>
  <input type="checkbox" id="menu-toggle">

  <label for="menu-toggle" class="hamburger">
    ☰
  </label>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="about.html">About</a>
    <a href="photos.html">Photos</a>
    <a href="specials.html">Chef Specials</a>
    <a href="staff.html">Staff</a>
    <a href="tables.html">Tables</a>
    <a href="contact.html">Contact Us</a>
  </div>
</nav>

</div>

<section>

<h2>Book a Table</h2>

<form>

<input type="text" placeholder="Your Name">
<input type="email" placeholder="Your Email">
<input type="tel" placeholder="Phone Number">
<input type="date">
<input type="time">

<select>
<option>1 Person</option>
<option>2 People</option>
<option>3 People</option>
<option>4 People</option>
<option>5 People</option>
<option>6 People</option>
</select>

<button>Book Table</button>

</form>

</section>

<div id="imagePopup" class="popup">
  <span class="close" onclick="closeImage()">&times;</span>
  <img class="popup-content" id="popupImg">
</div>

<script>

function openImage(src) {
  document.getElementById("imagePopup").style.display = "flex";
  document.getElementById("popupImg").src = src;
}

function closeImage() {
  document.getElementById("imagePopup").style.display = "none";
}

</script>

</body>
</html>
